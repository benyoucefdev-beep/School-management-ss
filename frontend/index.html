<!doctype html>
<html lang="en">
  <head>
    <!--
      PWA MANIFEST INJECTION — must be the first script in <head>.
      Runs synchronously during HTML parsing, before Vite's static
      <link rel="manifest"> is encountered, so the browser installs
      the correct portal-specific manifest when the user taps
      "Add to Home Screen" on their unique portal URL.
    -->
    <script>
      (function () {
        var path = window.location.pathname;
        var cm = path.match(/^\/portal\/([^/?#]+)/);
        var sm = path.match(/^\/supplier-portal\/([^/?#]+)/);
        var manifestUrl = cm
          ? '/api/student-portal/' + cm[1] + '/manifest'
          : sm
          ? '/api/teacher-portal/' + sm[1] + '/manifest'
          : null;
        if (manifestUrl) {
          var link = document.createElement('link');
          link.rel = 'manifest';
          link.href = manifestUrl;
          // Insert BEFORE any other head children already parsed
          document.head.insertBefore(link, document.head.firstChild);
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EduManage — School Education Management Platform. Student, teacher, and parent portals for modern schools." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#00b4d8" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>EduManage — School Management Platform</title>
    <script>
      // Light mode only — clear any previously saved dark preference
      localStorage.removeItem('edumanage_theme');
      document.documentElement.setAttribute('data-theme', 'light');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
